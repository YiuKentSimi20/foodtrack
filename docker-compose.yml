
services:
  db:
    image: postgres:15-alpine
    container_name: baza_de_date_foodtrack
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: foodtrack_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend-spring-boot:
    build:
      context: ./backend-spring-boot
      dockerfile: Dockerfile
    container_name: foodtrack-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/foodtrack_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      MY_AI_SERVICE_URL: http://ml-rcognition-model:8085
    ports:
      - "8083:8083"

  ml-rcognition-model:
    build:
      context: ./ml-recognition-model
      dockerfile: Dockerfile
    container_name: foodtrack-ml
    ports:
      - "8085:8085"
      

volumes:
  postgres_data:

networks:
  foodtrack-network:
    driver: bridge